name: launchguardian

# Drydock ships this workflow so the shipping-security review runs on every
# push instead of when someone remembers to invoke it.
#
# It runs on Linux deliberately. Semgrep's core talks to its CLI over a Unix
# socketpair, which native Windows does not provide, so a Windows-only setup
# cannot produce scan evidence at all. Running here means the evidence exists
# regardless of what the Owner's workstation can execute.
#
# --strict-scanners makes a scanner that produced no evidence fail the build
# rather than report zero findings. Absence of output is not a clean scan.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: shipping security review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install scanners
        run: |
          python -m pip install --upgrade pip
          python -m pip install semgrep launchguardian

      - name: Record the scanned commit
        run: echo "LG_COMMIT=${GITHUB_SHA}" >> "${GITHUB_ENV}"

      - name: Run LaunchGuardian
        run: launchguardian scan --target . --strict-scanners

      - name: Upload scan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: launchguardian-${{ env.LG_COMMIT }}
          path: reports/launchguardian
          if-no-files-found: warn
          retention-days: 90
